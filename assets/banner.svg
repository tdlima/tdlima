<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Jr. Lima — IA aplicada, Claude e automações">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1626"/>
      <stop offset="1" stop-color="#15263D"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#C9A15E" opacity=".13"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C9A15E" stop-opacity=".28"/>
      <stop offset="1" stop-color="#C9A15E" stop-opacity="0"/>
    </radialGradient>
    <style>
      .sans{font-family:'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif}
      .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,Menlo,monospace}
      .edge{stroke:#C9A15E;stroke-opacity:.35;stroke-width:1.4;fill:none}
      .pulse{stroke:#E3C58C;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-dasharray:14 400;animation:flow 3.2s linear infinite}
      .p2{animation-delay:.8s}.p3{animation-delay:1.6s}.p4{animation-delay:2.4s}
      .node{fill:#0E1C2F;stroke:#C9A15E;stroke-width:1.6}
      .cursor{animation:blink 1.1s steps(1) infinite}
      .ring{transform-origin:1030px 160px;animation:spin 40s linear infinite}
      @keyframes flow{from{stroke-dashoffset:414}to{stroke-dashoffset:0}}
      @keyframes blink{50%{opacity:0}}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect x="0" y="0" width="1280" height="3" fill="#C9A15E"/>

  <!-- Texto -->
  <text x="72" y="84" class="mono" font-size="15" letter-spacing="2.5" fill="#C9A15E">// IA APLICADA · CLAUDE · AUTOMAÇÕES</text>
  <text x="70" y="156" class="sans" font-size="68" font-weight="600" fill="#F3EFE7" letter-spacing="-1">Jr. Lima</text>
  <text x="72" y="196" class="sans" font-size="22" fill="#AEB8C7">Agentes, assistentes e automações com IA para empresas</text>

  <!-- Terminal -->
  <rect x="72" y="226" width="420" height="50" rx="8" fill="#0A1422" stroke="#C9A15E" stroke-opacity=".28"/>
  <circle cx="92" cy="251" r="4" fill="#C9A15E" opacity=".9"/>
  <text x="108" y="257" class="mono" font-size="16" fill="#E3C58C">$</text>
  <text x="126" y="257" class="mono" font-size="16" fill="#D7DDE6">claude "automatize este processo"</text>
  <rect x="452" y="241" width="9" height="20" fill="#E3C58C" class="cursor"/>

  <!-- Rede neural / fluxo -->
  <circle cx="1030" cy="160" r="150" fill="url(#glow)"/>
  <g class="ring">
    <circle cx="1030" cy="160" r="118" fill="none" stroke="#C9A15E" stroke-opacity=".22" stroke-dasharray="2 9"/>
  </g>

  <g>
    <path class="edge" d="M850 90 L940 120 L1030 160"/>
    <path class="edge" d="M850 230 L940 200 L1030 160"/>
    <path class="edge" d="M1030 160 L1120 120 L1210 90"/>
    <path class="edge" d="M1030 160 L1120 200 L1210 230"/>
    <path class="edge" d="M940 120 L940 200"/>
    <path class="edge" d="M1120 120 L1120 200"/>
    <path class="edge" d="M1030 160 L1030 52"/>
    <path class="edge" d="M1030 160 L1030 268"/>

    <path class="pulse" d="M850 90 L940 120 L1030 160 L1120 120 L1210 90"/>
    <path class="pulse p2" d="M850 230 L940 200 L1030 160 L1120 200 L1210 230"/>
    <path class="pulse p3" d="M850 90 L940 120 L940 200 L1030 160 L1120 120 L1120 200 L1210 230"/>
    <path class="pulse p4" d="M1030 52 L1030 160 L1030 268"/>
  </g>

  <g>
    <circle class="node" cx="850" cy="90" r="7"/>
    <circle class="node" cx="850" cy="230" r="7"/>
    <circle class="node" cx="940" cy="120" r="9"/>
    <circle class="node" cx="940" cy="200" r="9"/>
    <circle class="node" cx="1120" cy="120" r="9"/>
    <circle class="node" cx="1120" cy="200" r="9"/>
    <circle class="node" cx="1210" cy="90" r="7"/>
    <circle class="node" cx="1210" cy="230" r="7"/>
    <circle class="node" cx="1030" cy="52" r="6"/>
    <circle class="node" cx="1030" cy="268" r="6"/>
    <circle cx="1030" cy="160" r="34" fill="#0E1C2F" stroke="#E3C58C" stroke-width="2"/>
    <text x="1030" y="168" text-anchor="middle" class="mono" font-size="22" font-weight="700" fill="#E3C58C">IA</text>
  </g>

  <text x="850" y="72" text-anchor="middle" class="mono" font-size="11" fill="#8E9AAD">dados</text>
  <text x="850" y="256" text-anchor="middle" class="mono" font-size="11" fill="#8E9AAD">apis</text>
  <text x="1210" y="72" text-anchor="middle" class="mono" font-size="11" fill="#8E9AAD">agentes</text>
  <text x="1210" y="256" text-anchor="middle" class="mono" font-size="11" fill="#8E9AAD">resultados</text>
</svg>
